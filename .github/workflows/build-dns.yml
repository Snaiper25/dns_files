name: Generate MikroTik lists

on:
  push:
    branches:
      - main
    paths:
      - "domains/**"
      - "networks/**"
      - "scripts/generate_dns.py"
      - ".github/workflows/build-dns.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate RouterOS file
        run: python scripts/generate_dns.py

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/dns-auto.rsc

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto-generate MikroTik lists"
          git push
